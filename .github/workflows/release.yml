---
name: release
on:
  workflow_dispatch: # makes it possible to run the workflow manually
  push:
    branches:
      - main

env:
  CYPRESS_INSTALL_BINARY: "0" # https://docs.cypress.io/app/references/advanced-installation#Environment-variables

# Never run two releases against the same branch at once (avoids double publishes)
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # npm OIDC trusted publishing (no NPM_TOKEN needed)
    steps:
      - name: Mint a release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write # push the Version PR branch, tags, and GitHub releases
          permission-pull-requests: write # open/update the "Version Packages" PR
          permission-workflows: write # a new tag ref carries .github/workflows/*; a GitHub App can't create those tags without this
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # changesets pushes the Version PR branch with this token
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - run: pnpm build # generate the dist files for the release
      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge on the Version PR
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEPS_CHANGESETS_OUTPUTS_PULLREQUESTNUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: >
          gh pr merge "${STEPS_CHANGESETS_OUTPUTS_PULLREQUESTNUMBER}" --auto --squash --repo "${{ github.repository }}"
